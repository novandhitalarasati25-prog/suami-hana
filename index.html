<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Foto</title>
<style>
  :root { --bg:#12121a; --card:#1e1e2c; --accent:#7c5cff; --ok:#2ecc71; --bad:#e74c3c; --text:#f2f2f7; --muted:#a9a9c0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text);
         display:flex; flex-direction:column; align-items:center; padding:16px; min-height:100vh; }
  h1 { margin:8px 0 4px; }
  button, label.btn { background:var(--accent); color:#fff; border:0; padding:10px 16px; border-radius:10px;
           font-size:15px; cursor:pointer; display:inline-block; }
  button.alt, label.btn.alt { background:var(--card); }
  button.active { outline:2px solid #fff; }
  input[type=file] { display:none; }
  .tabs { display:flex; gap:8px; margin:12px 0; flex-wrap:wrap; justify-content:center; }
  .info { display:flex; gap:16px; margin-bottom:12px; font-size:15px; align-items:center; flex-wrap:wrap; justify-content:center; }
  section { width:100%; display:flex; flex-direction:column; align-items:center; }

  /* Memory */
  .grid { display:grid; gap:10px; width:100%; max-width:560px; grid-template-columns:repeat(3,1fr); }
  @media (min-width:520px){ .grid { grid-template-columns:repeat(4,1fr); } }
  .tile { aspect-ratio:3/4; perspective:800px; cursor:pointer; }
  .inner { position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d; }
  .tile.flip .inner { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; border-radius:12px; backface-visibility:hidden; -webkit-backface-visibility:hidden; overflow:hidden; }
  .front { background:linear-gradient(135deg,var(--accent),#3a2a99); display:flex; align-items:center; justify-content:center; font-size:32px; }
  .back { transform:rotateY(180deg); background:var(--card); }
  .back img { width:100%; height:100%; object-fit:cover; display:block; }
  .tile.done .back { outline:3px solid var(--ok); }
  #win { display:none; margin-top:16px; font-size:20px; color:var(--ok); text-align:center; }

  /* Tebak */
  .zoom { width:min(320px,90vw); aspect-ratio:1; border-radius:16px; background-color:var(--card);
          background-repeat:no-repeat; border:3px solid var(--accent); }
  .opts { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; justify-content:center; }
  .opt { width:100px; aspect-ratio:3/4; border-radius:12px; overflow:hidden; border:3px solid transparent; cursor:pointer; padding:0; background:var(--card); }
  .opt img { width:100%; height:100%; object-fit:cover; display:block; }
  .opt.ok { border-color:var(--ok); } .opt.bad { border-color:var(--bad); }
  #msg { margin-top:12px; min-height:26px; font-size:17px; }

  /* Galeri */
  .gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; width:100%; max-width:800px; }
  .gallery figure { margin:0; background:var(--card); border-radius:12px; overflow:hidden; }
  .gallery img { width:100%; aspect-ratio:3/4; object-fit:cover; display:block; }
  .gallery figcaption { padding:8px; text-align:center; font-size:14px; word-break:break-all; }
</style>
</head>
<body>
<h1>🃏 Game Foto</h1>

<div class="tabs">
  <button id="tabMem" class="active">Memory</button>
  <button id="tabQuiz" class="alt">Tebak Foto</button>
  <button id="tabGal" class="alt">Galeri</button>
  <label class="btn alt" for="file">➕ Tambah Foto</label>
  <input type="file" id="file" accept="image/*" multiple>
</div>

<section id="vMem">
  <div class="info">
    <span>Langkah: <b id="moves">0</b></span>
    <span>Pasangan: <b id="pairs">0</b>/<b id="total">0</b></span>
    <button id="restart">Acak Ulang</button>
  </div>
  <div class="grid" id="grid"></div>
  <div id="win">🎉 Selesai! Kamu menang dalam <b id="finalMoves"></b> langkah.</div>
</section>

<section id="vQuiz" style="display:none">
  <div class="info">
    <span>Skor: <b id="score">0</b>/<b id="rounds">0</b></span>
    <button id="next">Soal Berikutnya</button>
  </div>
  <div class="zoom" id="zoom"></div>
  <div id="msg">Bagian foto yang mana ini?</div>
  <div class="opts" id="opts"></div>
</section>

<section id="vGal" style="display:none">
  <div class="gallery" id="gallery"></div>
</section>

  // PHOTOS = [{ src: "data:image/jpeg;base64,...", nama: "Foto 1" }, ...]

  const $ = id => document.getElementById(id);
  const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

  // ---------- Tab ----------
  const views = { Mem:$("vMem"), Quiz:$("vQuiz"), Gal:$("vGal") };
  function show(name) {
    for (const k in views) {
      views[k].style.display = k === name ? "flex" : "none";
      $("tab"+k).className = k === name ? "active" : "alt";
    }
    if (name === "Quiz" && !quizReady) nextQuestion();
  }
  $("tabMem").onclick = () => show("Mem");
  $("tabQuiz").onclick = () => show("Quiz");
  $("tabGal").onclick = () => show("Gal");

  // ---------- Memory ----------
  let first=null, lock=false, moves=0, pairs=0;
  function startGame() {
    $("grid").innerHTML = ""; $("win").style.display = "none";
    first=null; lock=false; moves=0; pairs=0;
    $("moves").textContent=0; $("pairs").textContent=0; $("total").textContent=PHOTOS.length;
    shuffle([...PHOTOS.keys(), ...PHOTOS.keys()]).forEach(i => {
      const t = document.createElement("div");
      t.className = "tile"; t.dataset.id = i;
      t.innerHTML = `<div class="inner"><div class="face front">❓</div>
        <div class="face back"><img src="${PHOTOS[i].src}" alt=""></div></div>`;
      t.onclick = () => pick(t);
      $("grid").appendChild(t);
    });
  }
  function pick(t) {
    if (lock || t.classList.contains("flip")) return;
    t.classList.add("flip");
    if (!first) { first = t; return; }
    moves++; $("moves").textContent = moves;
    if (first.dataset.id === t.dataset.id) {
      first.classList.add("done"); t.classList.add("done");
      pairs++; $("pairs").textContent = pairs; first = null;
      if (pairs === PHOTOS.length) { $("finalMoves").textContent = moves; $("win").style.display = "block"; }
    } else {
      lock = true;
      setTimeout(() => { first.classList.remove("flip"); t.classList.remove("flip"); first=null; lock=false; }, 900);
    }
  }
  $("restart").onclick = startGame;

  // ---------- Tebak Foto (potongan zoom) ----------
  let quizReady=false, answer=-1, score=0, rounds=0, answered=false;
  function nextQuestion() {
    quizReady = true; answered = false;
    answer = Math.floor(Math.random()*PHOTOS.length);
    const z = $("zoom");
    z.style.backgroundImage = `url("${PHOTOS[answer].src}")`;
    z.style.backgroundSize = "300%";                       // zoom 3x
    z.style.backgroundPosition = `${Math.random()*100}% ${Math.random()*100}%`;
    $("msg").textContent = "Bagian foto yang mana ini?"; $("msg").style.color = "";
    $("opts").innerHTML = "";
    PHOTOS.forEach((p, i) => {
      const b = document.createElement("button");
      b.className = "opt"; b.innerHTML = `<img src="${p.src}" alt="">`;
      b.onclick = () => guess(i, b);
      $("opts").appendChild(b);
    });
  }
  function guess(i, btn) {
    if (answered) return; answered = true; rounds++;
    const opts = $("opts").children;
    if (i === answer) { score++; btn.classList.add("ok"); $("msg").textContent = "✅ Benar!"; $("msg").style.color = "var(--ok)"; }
    else { btn.classList.add("bad"); opts[answer].classList.add("ok"); $("msg").textContent = "❌ Salah, ini jawabannya."; $("msg").style.color = "var(--bad)"; }
    $("score").textContent = score; $("rounds").textContent = rounds;
    $("zoom").style.backgroundSize = "cover"; $("zoom").style.backgroundPosition = "center";
  }
  $("next").onclick = nextQuestion;

  // ---------- Galeri ----------
  function renderGallery() {
    $("gallery").innerHTML = PHOTOS.map(p =>
      `<figure><img src="${p.src}" alt=""><figcaption>${p.nama}</figcaption></figure>`).join("");
  }

  // ---------- Tambah foto sendiri ----------
  $("file").addEventListener("change", e => {
    const files = [...e.target.files].filter(f => f.type.startsWith("image/"));
    files.forEach(f => PHOTOS.push({ src: URL.createObjectURL(f), nama: f.name.replace(/\.[^.]+$/, "") }));
    renderGallery(); startGame(); quizReady = false; e.target.value = "";
  });

  renderGallery(); startGame();
</script>
</body>
</html>
